# Decap CMS: edits the JSON in /content; the site reads it at build time.
#
# Local editing (no account needed):
#   npm run cms        # starts the local Decap backend on :8081
#   npm run dev        # then open http://localhost:5173/admin/
#
# Editing the live site (Cloudflare Worker): sign-in goes through GitHub OAuth,
# handled by worker/auth.js + callback.js on the same site. Needs a GitHub
# OAuth App and GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET set on the Worker.
# base_url/auth_endpoint are set at runtime in admin/index.html.
backend:
  name: github
  repo: synthezizer/portfolio2
  branch: main

local_backend: true

media_folder: public/images # uploads land here…
public_folder: /images # …and are referenced like this on the site

collections:
  - name: projects
    label: projects
    label_singular: project
    folder: content/projects
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: title, widget: string }
      - { name: order, label: order, widget: number, value_type: int, default: 1, hint: "lower shows first" }
      - name: date
        label: date
        widget: string
        required: false
        hint: "MM/DD/YYYY, or leave empty"
        pattern: ['^(\d{1,2}/\d{1,2}/\d{4})?$', "use MM/DD/YYYY"]
      - { name: body, label: write-up, widget: text, required: false }
      - { name: image, label: image, widget: image, required: false, choose_url: true, hint: "fills the blue block" }
      - { name: alt, label: image description (alt text), widget: string, required: false, hint: "what's in the picture, for screen readers" }
      - { name: credit, label: image credit, widget: string, required: false, hint: "e.g. photo: name, CC BY-SA 3.0" }
      - { name: credit_url, label: credit link, widget: string, required: false }

  - name: pages
    label: pages
    files:
      - name: about
        label: about
        file: content/about.json
        fields:
          - { name: title, label: title, widget: string }
          - { name: from, label: where i'm from, widget: string, required: false, hint: "the line under the title, shown in spaced capitals" }
          - { name: body, label: about me, widget: text, required: false, hint: "leave a blank line between paragraphs" }
          - { name: image, label: image, widget: image, required: false, choose_url: true }
          - { name: alt, label: image description (alt text), widget: string, required: false }
          - { name: credit, label: image credit, widget: string, required: false }
          - { name: credit_url, label: credit link, widget: string, required: false }
          - name: discord_id
            label: discord user id
            widget: string
            required: false
            pattern: ['^(\d{15,22})?$', "the long number from Copy User ID, not your username"]
            hint: "Discord: turn on Developer Mode, right-click your name, Copy User ID. You must also join the Lanyard server: discord.gg/UrXF2cfJ7F. Empty hides the status."
          - name: stamps
            label: stamps
            label_singular: stamp
            widget: list
            required: false
            summary: "{{fields.alt}}"
            hint: "classic 99x56 web stamps show best"
            fields:
              - { name: image, label: image, widget: image, hint: "kept on this site, not hotlinked" }
              - { name: alt, label: description, widget: string }
              - { name: href, label: link, widget: string, required: false, hint: "optional: makes the stamp clickable" }
          - { name: show_activity, label: "show what i'm playing or listening to", widget: boolean, default: true, hint: "off shows only online / idle / busy / offline" }
      - name: contact
        label: contact
        file: content/contact.json
        fields:
          - { name: image, label: image, widget: image, required: false, choose_url: true }
          - { name: alt, label: image description (alt text), widget: string, required: false }
          - { name: credit, label: image credit, widget: string, required: false }
          - { name: credit_url, label: credit link, widget: string, required: false }
          - { name: intro, label: intro line, widget: text, required: false }
          - name: channels
            label: ways to reach me
            label_singular: channel
            widget: list
            summary: "{{fields.label}} · {{fields.value}}"
            fields:
              - { name: label, label: label, widget: string, hint: "e.g. email" }
              - { name: value, label: value, widget: string, hint: "what's shown, e.g. hello@example.com" }
              - { name: href, label: link, widget: string, required: false, hint: "mailto:… or https://… (empty = plain text)" }
              - { name: copy, label: copy button, widget: boolean, default: false }
              - { name: show_status, label: show live discord status, widget: boolean, default: false, required: false }
