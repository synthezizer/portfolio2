<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>andy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="andy's projects, a bit about me, and ways to reach me." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Hide the stage until the intro takes over; never longer than 3s if JS fails.
      document.documentElement.classList.add("is-loading");
      setTimeout(() => document.documentElement.classList.remove("is-loading"), 3000);
    </script>
  </head>
  <body data-view="projects">
    <div class="crushed">
    <header class="topbar">
      <div class="topbar__track" aria-hidden="true">
        <span class="topbar__line"></span>
        <span class="topbar__dot"></span>
      </div>
      <a class="topbar__name" href="#projects"><span class="topbar__word">ANDY</span></a>
    </header>

    <main class="stage">
      <div class="bracket" aria-hidden="true">
        <span class="bracket__top"></span>
        <span class="bracket__side"></span>
      </div>

      <nav class="nav" aria-label="Main">
        <a class="nav__link nav__link--projects" href="#projects" data-view="projects">
          <span class="nav__label"><span class="nav__word">PROJECTS</span></span>
          <svg class="icon icon--circles" viewBox="0 0 190 90" aria-hidden="true">
            <g class="circle circle--a">
              <circle class="circle__outer" cx="45" cy="45" r="45" />
              <circle class="circle__inner circle__inner--red" cx="66" cy="45" r="22" />
            </g>
            <g class="circle circle--b">
              <circle class="circle__outer" cx="145" cy="45" r="45" />
              <circle class="circle__inner circle__inner--blue" cx="145" cy="66" r="22" />
            </g>
          </svg>
        </a>
        <svg class="nav__arrow" viewBox="0 0 60 50" aria-hidden="true">
          <path d="M4 25h48M30 4l22 21-22 21" fill="none" stroke="currentColor" stroke-width="6" />
        </svg>
        <a class="nav__link nav__link--contact" href="#contact" data-view="contact">
          <span class="nav__label"><span class="nav__word">CONTACT</span></span>
          <svg class="icon icon--stars" viewBox="0 0 70 70" aria-hidden="true">
            <path class="star star--big" d="M28 22l5.9 12 13.2 1.9-9.6 9.3 2.3 13.2L28 52.2 16.2 58.4l2.3-13.2-9.6-9.3 13.2-1.9z" />
            <path class="star star--small" d="M54 2l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1z" />
          </svg>
        </a>
        <span class="nav__break" aria-hidden="true"></span>
        <svg class="nav__arrow" viewBox="0 0 60 50" aria-hidden="true">
          <path d="M4 25h48M30 4l22 21-22 21" fill="none" stroke="currentColor" stroke-width="6" />
        </svg>
        <a class="nav__link nav__link--about" href="#about" data-view="about">
          <span class="nav__label"><span class="nav__word">ABOUT</span></span>
          <svg class="icon icon--eye eye" viewBox="0 0 90 90" aria-hidden="true">
            <g class="eye__group"><circle class="eye__outer" cx="45" cy="45" r="45" /><circle class="eye__inner" cx="45" cy="24" r="22" /></g>
          </svg>
        </a>
      </nav>

      <section class="view view--projects" id="projects" aria-labelledby="project-title">
        <div class="media media--project" data-flip-id="hero" aria-hidden="true">
          <div class="media__fill"></div>
        </div>
        <article class="project">
          <h1 class="project__title" id="project-title"></h1>
          <time class="project__date"></time>
          <p class="project__body"></p>
        </article>
        <div class="pager">
          <button class="pager__btn pager__btn--prev" type="button" aria-label="Previous project">
            <svg viewBox="0 0 34 32" aria-hidden="true"><path d="M0 16L34 0v32z" /></svg>
          </button>
          <span class="pager__num" aria-hidden="true"><span class="pager__digit"></span></span>
          <button class="pager__btn pager__btn--next" type="button" aria-label="Next project">
            <svg viewBox="0 0 34 32" aria-hidden="true"><path d="M34 16L0 32V0z" /></svg>
          </button>
        </div>
      </section>

      <section class="view view--contact" id="contact" aria-labelledby="contact-title" hidden>
        <div class="contact">
          <h1 class="contact__title" id="contact-title">ways to reach me</h1>
          <div class="contact__body">
            <p class="contact__intro"></p>
            <ul class="contact__list"></ul>
          </div>
        </div>
        <div class="media media--contact" data-flip-id="hero" aria-hidden="true">
          <div class="media__fill"></div>
        </div>
      </section>

      <section class="view view--about" id="about" aria-labelledby="about-title" hidden>
        <div class="about">
          <h1 class="about__title" id="about-title"></h1>
          <p class="about__from" hidden><svg class="about__pin" viewBox="0 0 24 32" aria-hidden="true"><path fill-rule="evenodd" d="M12 0C5.4 0 0 5.4 0 12c0 8.6 12 20 12 20s12-11.4 12-20C24 5.4 18.6 0 12 0zm0 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" /></svg><span class="about__place"></span></p>
          <div class="about__body"></div>
        </div>
        <ul class="stamps stamps--slot" aria-hidden="true"></ul>
        <div class="media media--about" data-flip-id="hero" aria-hidden="true">
          <div class="media__fill"></div>
        </div>
        <div class="contact__item presence" hidden>
          <span class="contact__rule" aria-hidden="true"></span>
          <div class="contact__row presence__row">
            <span class="sr-only">discord status:</span>
            <div class="presence__state">
              <svg class="eye eye--live presence__eye" viewBox="0 0 90 90" aria-hidden="true">
                <g class="eye__group"><circle class="eye__outer" cx="45" cy="45" r="45" /><circle class="eye__inner" cx="60" cy="60" r="22" /></g>
              </svg>
              <span class="presence__mask"><span class="presence__word">checking...</span></span>
            </div>
            <p class="presence__activity" hidden></p>
          </div>
        </div>
      </section>

      <div class="curtain" aria-hidden="true"></div>
    </main>

    <p class="sr-only" role="status" aria-live="polite" id="status"></p>

    <!-- bitcrush: the dither sits under the filter, so the color crush turns it into real ordered dithering -->
    <div class="crush" aria-hidden="true"></div>
    </div>

    <!-- outside the crushed wrapper so they stay clean; lined up over .stamps--slot in About -->
    <ul class="stamps stamps--real" aria-label="stamps"></ul>
    <svg class="crush-defs" width="0" height="0" aria-hidden="true">
      <filter id="bitcrush" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <!-- at rest: one sample per 2x2 block, spread by offsets (2px can't come from a dilate, which only makes odd sizes) -->
        <feFlood x="0" y="0" width="1" height="1" flood-color="#000" />
        <feComposite width="2" height="2" />
        <feTile result="grid" />
        <feComposite in="SourceGraphic" in2="grid" operator="in" result="dots" />
        <feOffset in="dots" dx="1" dy="0" result="right" />
        <feMerge result="wide"><feMergeNode in="dots" /><feMergeNode in="right" /></feMerge>
        <feOffset in="wide" dx="0" dy="1" result="down" />
        <feMerge><feMergeNode in="wide" /><feMergeNode in="down" /></feMerge>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0.0000 0.1111 0.2222 0.3333 0.4444 0.5556 0.6667 0.7778 0.8889 1.0000" />
          <feFuncG type="discrete" tableValues="0.0000 0.1111 0.2222 0.3333 0.4444 0.5556 0.6667 0.7778 0.8889 1.0000" />
          <feFuncB type="discrete" tableValues="0.0000 0.1111 0.2222 0.3333 0.4444 0.5556 0.6667 0.7778 0.8889 1.0000" />
        </feComponentTransfer>
      </filter>
      <filter id="bitcrush-phone" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <!-- small screens at rest: color crush only, because a 2px grid destroys small text -->
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0.0000 0.1111 0.2222 0.3333 0.4444 0.5556 0.6667 0.7778 0.8889 1.0000" />
          <feFuncG type="discrete" tableValues="0.0000 0.1111 0.2222 0.3333 0.4444 0.5556 0.6667 0.7778 0.8889 1.0000" />
          <feFuncB type="discrete" tableValues="0.0000 0.1111 0.2222 0.3333 0.4444 0.5556 0.6667 0.7778 0.8889 1.0000" />
        </feComponentTransfer>
      </filter>
      <filter id="bitcrush-spring" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <!-- during a page switch: bigger blocks, odd sizes -->
        <feFlood id="bitcrush-flood" x="1" y="1" width="1" height="1" flood-color="#000" />
        <feComposite id="bitcrush-cell" width="3" height="3" />
        <feTile result="grid" />
        <feComposite in="SourceGraphic" in2="grid" operator="in" />
        <feMorphology id="bitcrush-dilate" operator="dilate" radius="1" />
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0.0000 0.1429 0.2857 0.4286 0.5714 0.7143 0.8571 1.0000" />
          <feFuncG type="discrete" tableValues="0.0000 0.1429 0.2857 0.4286 0.5714 0.7143 0.8571 1.0000" />
          <feFuncB type="discrete" tableValues="0.0000 0.1429 0.2857 0.4286 0.5714 0.7143 0.8571 1.0000" />
        </feComponentTransfer>
      </filter>
    </svg>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
